# s1-general: the general standard of Sentinel-1, what a watched area runs once its model is registered.
# A draft: the panel spec majortom-global is written but its coherence stores are still to be made, so no model,
# scoring spec hash or calibration is registered yet. Publishing it means filling `model.ref`, `scoring_spec_hash`
# and `calibrations` from the registry, setting `status: published`, and `ponzi-models register-standard`.
# Its id is this file's name and its version its content hash, s1-general@<hash8> (ponzi-core CR-089).
status: draft
sensor: S1
description: >-
  Sentinel-1 surface disturbance monitoring: the TiDE forecaster with weather inputs and the previous observed value
  for a missing coherence, trained and calibrated on the Major TOM panel, with the single-path detection.
panel: majortom-global
coherence: isce3-gaussian    # the code's defaults
onboarding: all-steps        # every step, the code's defaults
model:
  model_id: tide-weather-fill-previous@93771aa3--majortom-global@2436d8cb
scoring_spec_hash: ""
calibrations: []
detection: single-path       # code 50, Et dating, no gap bridged, no episodes
requires:
  ponzi: ">=0.0.1"
  ponzi-pipeline: ">=0.0.1"
  ponzi-models: ">=0.0.1"
