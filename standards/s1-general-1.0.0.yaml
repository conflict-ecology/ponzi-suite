# The first general standard: what a watched area runs on Sentinel-1 once its model is registered.
# A DRAFT (status: draft, ponzi-core CR-055): the panel is defined (panels/majortom-global) but its coherence
# stores are still to be made, so no model, run config hash or calibration is registered yet. Publishing it means
# filling `model.ref`, `run_config_hash` and `calibrations` from the registry, setting `status: published`, and
# passing `ponzi-models check-standard`.
id: s1-general
version: 1.0.0
status: draft
sensor: S1
description: >-
  Sentinel-1 surface disturbance monitoring: the TiDE forecaster with weather inputs and the previous observed value
  for a missing coherence, trained and calibrated on the Major TOM panel, with the single-path recipe.
panel: majortom-global@0.4.0
workflow:
  - {name: discover, version: "1"}
  - {name: dem, version: "1"}
  - {name: coherence, version: "1"}
  - {name: assemble, version: "1"}
  - {name: onboard, version: "1"}
  - {name: run, version: "1"}
  - {name: pvalues, version: "1"}
  - {name: detect, version: "1"}
  - {name: tile, version: "1"}
coherence: {}      # the coherence config's defaults (ponzi_pipeline.config.CoherenceConfig)
onboarding: {}     # the onboarding config's defaults (ponzi_pipeline.onboard.config.OnboardingConfig)
model:
  model_id: tide-weather-fill-previous--majortom-global-0.4.0
run_config_hash: ""
calibrations: []
recipe: {}         # the default single-path recipe (code 50, Et dating, no gap bridged, no episodes)
requires:
  ponzi: ">=0.2.4"
  ponzi-pipeline: ">=0.2"
  ponzi-models: ">=0.3"
