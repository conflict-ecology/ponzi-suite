# A detection spec (ponzi-core CR-070; ponzi.products.detection_spec.DetectionSpec): how the events and cells are
# made from p-values. single-path is the single-path detection with the code's defaults: the ceiling calibration's
# codes flagged at 50 (-log10 p 2.5), dated by Et one anchor before to four after the first flag, no gap bridged,
# exclusive dating windows, no episodes. The Gaza release's values are testcases/gaza/detection.yaml.
calibration_kind: ceiling
code: 50
gap: 0
dating_pre: 1
dating_post: 4
windows: exclusive
