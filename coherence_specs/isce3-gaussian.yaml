# A coherence spec (ponzi-core CR-070; ponzi_pipeline.coherence_spec.CoherenceSpec): how a burst's coherence store
# is made. isce3-gaussian is the ISCE3 chain of 10 by 2 looks with the Gaussian window of sigma 1 truncated at 2, on
# the burst's fixed 40 m grid: the code's defaults, written out (a default written out does not change the hash).
# A spec has no version: a changed one is a new file under a new name (isce3-gaussian-<change>).
schema_version: 1
backend: isce3
polarisation: VV
platforms: [S1A]
revisit_days: 12
baseline_days: [12, 24, 36, 48, 60]
pair_tolerance_days: 1.0
looks: {range: 10, azimuth: 2}
window: {kind: gaussian, sigma_range: 1.0, sigma_azimuth: 1.0, truncate: 2.0}
grid: {posting_m: 40.0, buffer_m: 0.0}
dem: {source: glo_30, margin_km: 5.0}
