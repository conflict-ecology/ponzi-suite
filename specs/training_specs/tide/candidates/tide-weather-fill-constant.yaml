# tide-weather-fill-constant: the control of the fill specs. A missing coherence of the past window is the
# constant 0.5 with the obs flags, as in tide-weather; each other fill spec differs from this one in the fill alone.
# Common to the fill specs (tide-weather-fill-*): the future rows' obs channels are what a run gives the model
# (`future_obs: one`, constant 1), a missing covariate in a window is an error and never a filled value
# (`strict_covariates`), and in a run the model honours the scoring spec's `context.min_support` as the rolling
# forecaster does (`support: gated`; the fit does not filter on it, and its model card breaks the val loss down by
# the number of observed values).
# Fitted at seeds 42 and 43: `ponzi-models train --training-spec tide-weather-fill-constant` and again with `--seed 43`.
extends: ../tide-weather.yaml
missing:
  fill: constant
  value: 0.5
  flag: true
future_obs: one
strict_covariates: true
support: gated
