# majortom-global: the panel a model is trained, validated and calibrated on, and how it is built. The folder is
# the panel spec and its name is the panel's; its version is its hash, cited majortom-global@<hash8> (panel-check
# prints it). bursts.geojson and cells.geojson must match the sha256 under `files`.
#   check:  pixi run ponzi-models panel-check majortom-global
#   build:  pixi run ponzi-models panel-build --panel-spec majortom-global --bursts BURSTS.csv --without-outline drop
# The 24 cells without an outline (notes.outlines) are refused unless dropped. The build goes into the PONZI home
# (panels/majortom-global@<hash8>) and archives this version, and its coherence spec's, in the registry.
description: >-
  The Major TOM training panel: 239 cells of the 10 km Major TOM grid, stratified by climate and settlement, and the
  487 Sentinel-1 bursts that cover them, each cell observed over three years with no event. The train split trains
  a model, val checks it, and test is the calibration null (the independent locations whose scores give the
  p-values).
coherence: isce3-gaussian      # the coherence spec its bursts are made with
draw:                          # the pixels of each cell
  per_stratum: 1000            # per cell and pixel stratum, shared over the cell's bursts by area
  built_threshold: 0.3         # built: sidecar `built` >= this
  land_threshold: 0.5          # land not built: sidecar `land` >= this and not built
  seed: 1
splits:
  cells: {train: 143, val: 48, test: 48}
  bursts: {train: 285, val: 102, test: 99, mixed: 1}   # mixed: one burst whose cells are in two splits
files:
  bursts.geojson: 36254cdd501da57360e12c98c34086a1209d65a32934ff14de9f469512344834
  cells.geojson: f3d3a7a583d23d8e6927f167f15e54bf7ef2116275ef2776f63872ea67717e41
notes:                         # read by no code and not in the hash, like `description`
  subpanels:
    majortom: {cells: {train: 120, val: 40, test: 40}, note: 8 test cells per climate, 5 climates}
    majortom-arid: {cells: {train: 23, val: 8, test: 8}, note: drylands only}
  windows: >-
    Per cell, 1 January of its hist_year to 31 December two years later. A burst's window spans its cells'.
  footprints:
    source: OPERA burst database, burst_db 0.18.0, burst-id-geometries-simple-0.18.0.geojson.zip
    sha256: e3a52b728ba4b117ac8f2357f638f26c9034816bf89c4f0c3391b2f6392230f7
    note: >-
      The burst map (burst_db 0.10.0, opera-burst-bbox-only.sqlite3) holds the same 1,127,661 burst ids, so every
      burst here also has its fixed processing grid.
  outlines: >-
    215 cells have their 10.68 km Major TOM tile as outline; 24 have none (their tile is not a plain scaling of the
    grid cell, so it is not guessed).
