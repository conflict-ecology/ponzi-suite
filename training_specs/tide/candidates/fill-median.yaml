# A CANDIDATE, not a registered model: tide-weather with another treatment of missing values (ponzi-core
# CR-016). A missing coherence of the past window is the MEDIAN of the pixel's observed values of that baseline in the
# 30-date past window, with the obs flags.
# The rest is training_specs/tide/weather.yaml, key for key (the reference of the comparison is the registered model
# tide_c30_pdcompact_mt0.4). Common to the candidates and the control: the obs channels of the future rows are what a
# run gives the model (constant 1, or absent), a missing covariate in a window is an error and never a filled value
# (`strict_covariates`), in a run the model honours the scoring spec's `context.min_support` as the rolling fits do
# (`support: gated`; the fit itself does not filter on it, and its model card breaks the val loss down by the number
# of observed values), and, as for every fit of this trainer, the anchors are those a run scores.
# Fitted at two seeds: `training/train.py --seed 42` and `--seed 43` (the fits are tide-weather-fill-median-seed42 and
# _s43); the ten fits (with the control's) are one array job, hpc/train_candidates.sbatch. The prepared files are
# those of tide-weather.
# Validated by training/training_spec.py (TrainingSpec); unknown keys are refused.
extends: ../weather.yaml
training_id: tide-weather-fill-median
formerly: tide_c30_pdcompact_median
missing:
  fill: median
  flag: true
future_obs: one
strict_covariates: true
support: gated
