name: docs
on:
  push:
  pull_request:
# one Pages deployment at a time; a newer push does not cancel one in progress
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ponzi-core of the same owner, beside this repository, as in a local checkout
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ponzi-core
          path: ponzi-core
          # ponzi-core is private: a read-only deploy key of ponzi-core, its private half kept as this secret
          ssh-key: ${{ secrets.PONZI_CORE_DEPLOY_KEY }}
          fetch-depth: 0   # ponzi-spec takes its version from its spec-v tags (CR-054)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -e ponzi-core/packages/spec
      - run: mkdocs build --strict
        env:
          PONZI_CORE: ${{ github.workspace }}/ponzi-core   # checked out inside the workspace above, not beside it
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  # publishes the site built above; only pushes to main, never pull requests
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
