# (CR-043: moved from data/specs/tide_c30_gaza_f1p.yaml into the Gaza test case, composed on the base forecaster; CR-052:
# named tide-weather-gaza-finetune, composed on forecasters/tide/weather.yaml.)
# The fit spec of the registered model tide_c30_gaza_f1p_mt0.2 (run config mon_b5h5_d38f1p_mean), the model of
# the Gaza releases. The keys below are the monorepo's configs/fm/tide_c30_gaza_f1p.yaml, unchanged (the artifact's
# meta.json says package v0.2 and the model card names this init_from; configs/fm/v04/ is the same fit on v0.4,
# which is not registered).
# Decision 38 round 2, F1p: a fine-tune of tide-weather fitted on package v0.2 (init_from), three epochs at
# a third of the learning rate, with the windows of the Gaza outside-Strip sample stores (extra_samples) that end
# before 2023-10-07 as half of every epoch, the last epoch kept.
# A RECORD OF HISTORY: the registered fit was trained by the monorepo's trainer on every anchor with a full
# context and horizon, a missing covariate filled with 0 (`anchors: all`). This trainer builds only the anchors a
# run scores, so a re-fit of this spec with the current code differs from the registered fit in that rule (in
# Major-TOM v0.2: the last two anchors of one train burst of 188). The treatment of missing values is unchanged:
# no key below declares one, which is 0.5 with the obs flags, the real future flags and a filled bperp.
# Validated by training/fit_spec.py (TideSpec); unknown keys are refused.
extends: ../../forecasters/tide/weather.yaml
fit_id: tide-weather-gaza-finetune
formerly: tide_c30_gaza_f1p
lr: 0.0001
epochs: 3
min_epochs: 1
extra_samples: ${PONZI_DATA_ROOT}/gaza/train_samples
extra_until: '2023-10-07'
init_from: ${PONZI_DATA_ROOT}/training/majortom_v0.2/tide-weather/checkpoint.pt
extra_share: 0.5
keep_last_epoch: true
