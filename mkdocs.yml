site_name: PONZI
site_description: Change detection on SAR coherence time series
# The site's address, the same as ponzi_spec.stac.DOCS_BASE (overhaul decision D15; ponzi-core CR-049)
site_url: https://conflict-ecology.github.io/ponzi-suite/
repo_name: conflict-ecology/ponzi-suite
repo_url: https://github.com/conflict-ecology/ponzi-suite
strict: true
# links and #anchors between pages are checked: a broken one fails the strict build
validation:
  links:
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  features:
    - content.code.copy
  # ponzi-visual's Conflict ecology skin: its fonts here, its colours in stylesheets/theme.css
  font:
    text: Archivo
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-4, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # the source of every distribution, from the checkouts beside the suite (the docs CI lays them out the same)
          paths:
            - ../ponzi-core/packages/spec/src
            - ../ponzi-core/packages/core/src
            - ../ponzi-core/packages/pipeline/src
            - ../ponzi-core/packages/models/src
            - ../ponzi-service/packages/server/src
            - ../ponzi-service/packages/worker/src
            - ../ponzi-service/packages/client/src
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: sphinx

hooks:
  - hooks/ponzi.py

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tasklist: {custom_checkbox: true}

extra_css:
  - stylesheets/theme.css
  - stylesheets/diagrams.css

extra_javascript:
  - javascripts/flows.js

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - System overview: getting-started/overview.md
      - Install: getting-started/install.md
      - "Quickstart: one machine": getting-started/quickstart.md
      - Logins and keys: getting-started/authentication.md
      - Folders and environment variables: getting-started/paths.md
  # the ideas, whichever package implements them
  - Concepts:
      - Overview: method/index.md
      - How PONZI works: method/workflows.md
      - Stages: method/stages.md
      - Content ids and reuse: using/content-ids.md
      - Provenance (manifests): using/manifests.md
      - Watched areas (under construction): using/watched-areas.md
      - Data sources and catalogs: method/data-sources.md
      - Specs and the PONZI home: service/configuration.md
  # by repository, then distribution: each opens on what it holds, then its pages, then its API reference;
  # page paths are unchanged, so published links hold
  - ponzi-core:
      - Overview: core/index.md
      - ponzi-spec:
          - Overview: core/ponzi-spec.md
          - STAC catalog profile: using/stac-profile.md
          - API reference: reference/ponzi-spec.md
      - ponzi:
          - Overview: core/ponzi.md
          - "Grids: processing and outputs": method/grids.md
          - Store formats (contracts): reference/contracts.md
          - API reference: reference/api/ponzi.md
      - ponzi-pipeline:
          - Overview: core/ponzi-pipeline.md
          - Making coherence stores: method/coherence.md
          - API reference: reference/api/ponzi-pipeline.md
      - ponzi-models:
          - Overview: models/index.md
          - Training panels: method/panels.md
          - Training and calibrating a model: models/new-model.md
          - Building a standard: models/standards.md
          - Standard versions: models/versions.md
          - Naming rules: models/naming.md
          - API reference: reference/api/ponzi-models.md
  - ponzi-service:
      - Overview: service/index.md
      - ponzi-server (under construction):
          - Running the server: service/server.md
          - REST API: service/rest-api.md
          - API reference: reference/api/ponzi-server.md
      - ponzi-worker:
          - Workflows and the cache: service/worker.md
          - Running on SLURM: service/hpc.md
          - API reference: reference/api/ponzi-worker.md
      - ponzi-client (under construction):
          - "Clients: Python, CLI, TypeScript": using/clients.md
          - API reference: reference/api/ponzi-client.md
      - Troubleshooting: service/troubleshooting.md
  - ponzi-visual (under construction):
      - Using the map: using/map.md
      - API reference: reference/api/ponzi-visual.md
  - Reference:
      - Overview: reference/index.md
      - Versions: reference/versions.md
      - Glossary: reference/terminology.md
      - Citations: reference/references.md
  - Contributing:
      - Overview: contributing/index.md
      - Roadmap: contributing/roadmap.md
      - Change process: contributing/process.md
      - Adding a stage: contributing/new-stage.md
      - For agents:
          - Overview: contributing/agents/index.md
          - Using PONZI: contributing/agents/usage.md
          - Changing the code: contributing/agents/contributing.md
  - Discoveries:
      - Overview: discoveries/index.md
      - Coherence computation: discoveries/coherence.md
      - Sensors and acquisitions: discoveries/acquisition.md
      - The time series: discoveries/time-series.md
      - Stores: discoveries/stores.md
      - Running on the cluster: discoveries/cluster.md
      - Campaigns: discoveries/campaigns.md
      - Detection and scoring: discoveries/detection.md
  - History:
      - Overview: history/index.md
      - The overhaul plan: history/overhaul-plan.md
      - The system before the overhaul: history/current-system.md
