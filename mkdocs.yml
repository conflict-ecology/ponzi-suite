site_name: PONZI
site_description: Change detection on SAR coherence time series
# The site's address, the same as ponzi_spec.stac.DOCS_BASE (overhaul decision D15; ponzi-core CR-049)
site_url: https://conflict-ecology.github.io/ponzi-suite/
repo_name: conflict-ecology/ponzi-suite
repo_url: https://github.com/conflict-ecology/ponzi-suite
strict: true

theme:
  name: material
  features:
    - navigation.indexes
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # the source of every distribution, from the checkouts beside the suite (the docs CI lays them out the same)
          paths:
            - ../ponzi-core/packages/spec/src
            - ../ponzi-core/packages/core/src
            - ../ponzi-core/packages/pipeline/src
            - ../ponzi-core/packages/models/src
            - ../ponzi-service/packages/server/src
            - ../ponzi-service/packages/worker/src
            - ../ponzi-service/packages/client/src
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: sphinx

hooks:
  - hooks/ponzi.py

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tasklist: {custom_checkbox: true}

extra_css:
  - stylesheets/diagrams.css

extra_javascript:
  - javascripts/flows.js

nav:
  - Home: index.md
  - The method:
      - method/index.md
      - How PONZI works: method/workflows.md
      - Coherence: method/coherence.md
      - Panels: method/panels.md
      - Grids: method/grids.md
      - Stages: method/stages.md
      - Data sources and catalogs: method/data-sources.md
  - Getting started:
      - getting-started/index.md
      - System overview: getting-started/overview.md
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - Authentication: getting-started/authentication.md
      - Paths and environment variables: getting-started/paths.md
  - Interacting with PONZI:
      - using/index.md
      - Watched areas: using/watched-areas.md
      - The map: using/map.md
      - The clients: using/clients.md
      - "Outputs: the STAC profile": using/stac-profile.md
      - Manifests: using/manifests.md
      - Content ids: using/content-ids.md
  - The service:
      - service/index.md
      - The server: service/server.md
      - The worker: service/worker.md
      - Running on the cluster: service/hpc.md
      - Configuration: service/configuration.md
      - REST API: service/rest-api.md
      - Troubleshooting: service/troubleshooting.md
  - Models and standards:
      - models/index.md
      - Making a standard: models/standards.md
      - Standard versions and naming: models/versions.md
      - Naming: models/naming.md
      - A new model: models/new-model.md
  - Reference:
      - reference/index.md
      - ponzi-spec: reference/ponzi-spec.md
      - API:
          - ponzi: reference/api/ponzi.md
          - ponzi-pipeline: reference/api/ponzi-pipeline.md
          - ponzi-models: reference/api/ponzi-models.md
          - ponzi-server: reference/api/ponzi-server.md
          - ponzi-worker: reference/api/ponzi-worker.md
          - ponzi-client: reference/api/ponzi-client.md
          - ponzi-visual: reference/api/ponzi-visual.md
      - Store contracts: reference/contracts.md
      - Versions: reference/versions.md
      - Terminology: reference/terminology.md
      - References: reference/references.md
  - Contributing:
      - contributing/index.md
      - Roadmap: contributing/roadmap.md
      - Change process: contributing/process.md
      - A new stage: contributing/new-stage.md
      - For agents:
          - contributing/agents/index.md
          - Using PONZI: contributing/agents/usage.md
          - Contributing: contributing/agents/contributing.md
  - Discoveries:
      - discoveries/index.md
      - Coherence computation: discoveries/coherence.md
      - Sensors and acquisitions: discoveries/acquisition.md
      - The time series: discoveries/time-series.md
      - Stores: discoveries/stores.md
      - Running on the cluster: discoveries/cluster.md
      - Campaigns: discoveries/campaigns.md
      - Detection and scoring: discoveries/detection.md
  - History:
      - history/index.md
      - The overhaul plan: history/overhaul-plan.md
      - The system before the overhaul: history/current-system.md
