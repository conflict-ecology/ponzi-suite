# The fit spec of the registered model tide_c30_pdcompact_mt0.4 (run config mon_b5h5_d38pc04_mean): fitted from
# scratch on the Major-TOM package v0.4 (the same spec on v0.2 gave tide_c30_pdcompact_mt0.2, the base of the Gaza
# fit). The keys below are the spec that fit was trained with, unchanged.
# Decision 35: the weather levels (soil moisture, snow depth, snow cover) plus the COMPACT set of their sidecar pair
# differences at the five baselines, covariate layer norm off.
# A RECORD OF HISTORY: the registered fit was trained by an earlier trainer on every anchor with a full
# context and horizon, a missing covariate filled with 0 (`anchors: all`). This trainer builds only the anchors a
# run scores, so a re-fit of this spec with the current code differs from the registered fit in that rule (in
# Major-TOM v0.2: the last two anchors of one train burst of 188). The treatment of missing values is unchanged:
# no key below declares one, which is 0.5 with the obs flags, the real future flags and a filled bperp.
# Validated by training/fit_spec.py (TideSpec); unknown keys are refused.
fit_id: tide-weather
formerly: tide_c30_pdcompact
model: tide
context_length: 30
horizon_length: 5
covariates: true
baseline_days:
- 12
- 24
- 36
- 48
- 60
quantile_levels: zu11
era5_vars:
- era5_swvl1
- era5_snow_depth
- era5_snow_cover
- era5_pd_swvl1_12d
- era5_pd_swvl1_24d
- era5_pd_swvl1_36d
- era5_pd_swvl1_48d
- era5_pd_swvl1_60d
- era5_pd_snow_depth_12d
- era5_pd_snow_depth_24d
- era5_pd_snow_depth_36d
- era5_pd_snow_depth_48d
- era5_pd_snow_depth_60d
- era5_pd_snow_cover_12d
- era5_pd_snow_cover_24d
- era5_pd_snow_cover_36d
- era5_pd_snow_cover_48d
- era5_pd_snow_cover_60d
hidden_size: 32
num_encoder_layers: 2
num_decoder_layers: 2
decoder_output_dim: 16
temporal_decoder_hidden: 16
temporal_width_future: 4
use_layer_norm: true
covariate_layer_norm: false
dropout: 0.2
batch_size: 256
lr: 0.0003
grad_clip: 1.0
epochs: 30
min_epochs: 10
early_stopping_patience: 5
early_stopping_min_delta: 1.0e-05
mask_missing_targets: true
seed: 42
wandb_project: ponzi-tide
wandb_log_steps: 100
